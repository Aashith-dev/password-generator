<!DOCTYPE html>
<html>

<head>

<title>Smart Password Generator</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<button class="toggle" onclick="toggleMode()">
<i class="fa-solid fa-moon"></i>
</button>

<div class="container">

<h1>
<i class="fa-solid fa-lock"></i>
Smart Password Generator
</h1>

<p>Create strong and secure passwords instantly</p>

<label>Password Length</label>

<br>

<input type="range" min="6" max="32" value="12" id="length">

<p id="lengthValue">12</p>

<div class="options">

<label>
<input type="checkbox" id="uppercase" checked>
Uppercase Letters
</label>
<br>

<label>
<input type="checkbox" id="lowercase" checked>
Lowercase Letters
</label>
<br>

<label>
<input type="checkbox" id="numbers" checked>
Numbers
</label>
<br>

<label>
<input type="checkbox" id="symbols">
Symbols
</label>

</div>

<br>

<button onclick="generatePassword()">
<i class="fa-solid fa-key"></i>
Generate Password
</button>

<h2 id="result"></h2>

<p id="strength"></p>

<button onclick="copyPassword()">
<i class="fa-solid fa-copy"></i>
Copy Password
</button>

<h3>Password History</h3>

<ul id="history"></ul>

<hr>

<h3>Check Your Password Strength</h3>

<input type="text" id="userPassword" placeholder="Enter your password">

<br><br>

<button onclick="checkUserPassword()">
<i class="fa-solid fa-shield-halved"></i>
Check Strength
</button>

<p id="userStrength"></p>

</div>

<script src="script.js"></script>

</body>

</html>
